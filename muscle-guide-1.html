<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل عضلات الجسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1020;--ink2:#121A30;--ink3:#1A2442;--gold:#C9A86A;--gold2:#EBD7A4;--ivory:#EFE8D8;--wine:#8E2F3C;--mute:#9AA3B8;--line:rgba(201,168,106,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;line-height:1.8;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.serif{font-family:'Amiri','Times New Roman',serif}
.hero{position:relative;min-height:92svh;display:grid;place-items:center;text-align:center;padding:48px 20px;overflow:hidden;--p:0}
.aurora{position:absolute;inset:-20%;background:radial-gradient(40% 35% at 25% 30%,rgba(201,168,106,.28),transparent 70%),radial-gradient(45% 40% at 78% 65%,rgba(142,47,60,.30),transparent 70%),radial-gradient(35% 30% at 55% 15%,rgba(60,84,160,.30),transparent 70%);filter:blur(30px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.08) rotate(3deg)}}
.hero-in{position:relative;opacity:calc(1 - var(--p)*.9);transform:translateY(calc(var(--p)*60px))}
.hero h1{margin:0;font-size:clamp(52px,12vw,138px);line-height:1.1;font-weight:700;letter-spacing:0}
.bt{display:inline-block;margin-inline:.12em;opacity:0;filter:blur(14px);transform:translateY(-.3em);transition:opacity .9s cubic-bezier(.2,.7,.2,1),filter .9s,transform .9s}
.bt.in{opacity:1;filter:blur(0);transform:none}
.shiny{background:linear-gradient(110deg,var(--gold) 35%,#fff7de 50%,var(--gold) 65%) 200% 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-20% 0}}
.hero p{margin:18px auto 30px;max-width:30em;font-size:clamp(17px,2.4vw,22px);color:var(--mute)}
.cta{border:1px solid var(--gold);background:rgba(201,168,106,.1);padding:12px 30px;border-radius:999px;font-weight:500;font-size:17px;transition:background .25s,color .25s}
.cta:hover{background:var(--gold);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:40px 20px 24px}
main{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.board{position:sticky;top:20px}
@media(max-width:900px){.board{position:static}}
.tabs{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:999px;width:fit-content;margin:0 auto 16px;background:var(--ink2)}
.tabs button{border:0;background:transparent;padding:7px 24px;border-radius:999px;color:var(--mute);transition:.25s}
.tabs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.plate{padding:14px;border-radius:10px;background:linear-gradient(160deg,#F3EDDF,#E4DAC2);box-shadow:0 0 0 1px var(--gold),0 0 0 7px var(--ink),0 0 0 8px var(--line),0 30px 60px rgba(0,0,0,.5)}
#body{width:100%;max-height:78vh;height:auto;display:block;margin:0 auto}
#body image{mix-blend-mode:multiply}
.r{cursor:pointer;fill:transparent;transition:fill .2s}
.r:hover{fill:rgba(142,47,60,.2)}
.r.on{fill:rgba(142,47,60,.38);stroke:var(--wine);stroke-width:5}
.r{stroke-linejoin:round;-webkit-tap-highlight-color:transparent}.r:focus{outline:none}
.r:focus-visible{outline:none;stroke:var(--gold);stroke-width:7;fill:rgba(142,47,60,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 15px;font-size:15px;color:var(--ivory);transition:.25s}
.chips button:hover{border-color:var(--gold)}
.chips button.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.spot{position:relative;overflow:hidden;--mx:50%;--my:0%}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(201,168,106,.16),transparent 60%)}
.detail{background:linear-gradient(180deg,var(--ink2),#0E1527);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,34px)}
.fade{animation:fin .5s cubic-bezier(.2,.7,.2,1)}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.mn{color:var(--gold);font-size:16px;margin:0;font-weight:500}
h2{margin:2px 0 6px;font-family:'Amiri',serif;font-size:clamp(28px,4vw,40px);line-height:1.3;font-weight:700}
.mach{color:var(--mute);margin:0 0 18px}
.stage{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px}
.stage{flex-direction:column;align-items:center;gap:10px}.stage .scene{width:min(100%,380px);height:auto}.pb{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 22px;font-size:14px}
.pz{text-align:center}.pz small{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.pz button{margin-top:10px;width:100%;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}
h3{margin:26px 0 6px;font-family:'Amiri',serif;font-size:24px;color:var(--gold2)}
ol{margin:0;padding-inline-start:24px;line-height:2}
ol li::marker{color:var(--gold);font-weight:700}
.tip{background:rgba(142,47,60,.18);border-inline-start:3px solid var(--wine);padding:12px 16px;border-radius:10px;margin-top:20px}
.alt{color:var(--mute);margin:14px 0 0;font-size:15px}
footer{max-width:1180px;margin:0 auto;padding:20px 20px calc(36px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:14px;border-top:1px solid var(--line)}

.hr-bar{position:fixed;top:0;inset-inline:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;background:rgba(11,16,32,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.hr-bar.headroom--unpinned{transform:translateY(-100%)}
.hr-bar.headroom--pinned{transform:none}
.hr-brand{font-family:'Amiri','Times New Roman',serif;font-size:22px;font-weight:700;color:var(--gold2);white-space:nowrap}
.hr-nav{display:flex;gap:6px}
.hr-nav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 16px;font-size:14px;color:var(--ivory);transition:.25s}
.hr-nav button:hover{border-color:var(--gold);background:rgba(201,168,106,.12)}
@media(prefers-reduced-motion:reduce){.hr-bar{transition:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bt{opacity:1;filter:none;transform:none}}
</style>
</head>
<body>
<header class="hr-bar" id="hrbar">
  <span class="hr-brand">دليل عضلات الجسم</span>
  <nav class="hr-nav" aria-label="التنقل">
    <button type="button" onclick="go('.hero')">الرئيسية</button>
    <button type="button" onclick="go('#explore')">الاستكشاف</button>
  </nav>
</header>

/* Lenis smooth scroll */
let lenis = null;
if (window.Lenis && !reduce) {
  lenis = new Lenis({ lerp: 0.09, smoothWheel: true });
  const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
  requestAnimationFrame(raf);
  lenis.on('scroll', ({ scroll }) => document.querySelector('.hero')?.style.setProperty('--p', Math.min(scroll / innerHeight, 1)));
}
const go = sel => {
  const el = document.querySelector(sel); if (!el) return;
  lenis ? lenis.scrollTo(el, { offset: -16, duration: 1.4 }) : el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
};

/* React Bits style components: BlurText, ShinyText, SpotlightCard */
function BlurText({ text, delay = 140 }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => { const t = setTimeout(() => setOn(true), 120); return () => clearTimeout(t); }, []);
  return html`<span ref=${ref} aria-label=${text}>${text.split(' ').map((w, i) =>
    html`<span key=${i} aria-hidden="true" class=${'bt' + (on ? ' in' : '')} style=${{ transitionDelay: i * delay + 'ms' }}>${w}</span>`)}</span>`;
}
const ShinyText = ({ children }) => html`<span class="shiny">${children}</span>`;
function SpotlightCard({ children, className = '', ...rest }) {

  return html`<section class=${'spot ' + className} onMouseMove=${mv} ...${rest}>${children}</section>`;
}
